name: Native release artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-release.yml"
      - "native/fast-native/**"
      - "rust/simplicio-fast-core/**"
      - "scripts/build_native_manifest.py"
      - "scripts/verify_fast_core_bundle.py"
      - "scripts/verify_native_bundle.py"
      - "tests/test_native_bundle_211.py"
      - "tests/test_fast_core_bundle.py"
      - "tests/test_native_release_workflow_211.py"
      - "pyproject.toml"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  contract:
    name: Validate publication contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract test runner
        run: python -m pip install pytest
      - name: Validate manifest and workflow contracts
        run: python -m pytest -q tests/test_native_bundle_211.py tests/test_fast_core_bundle.py tests/test_native_release_workflow_211.py

  build:
    name: Build ${{ matrix.platform }}
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            compatibility_filename: simplicio-fast-native
            core_filename: simplicio-fast-rs
            linker: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            compatibility_filename: simplicio-fast-native
            core_filename: simplicio-fast-rs
            linker: aarch64-linux-gnu-gcc
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
            compatibility_filename: simplicio-fast-native
            core_filename: simplicio-fast-rs
            linker: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            compatibility_filename: simplicio-fast-native.exe
            core_filename: simplicio-fast-rs.exe
            linker: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          target_key="$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
          echo "CARGO_TARGET_${target_key}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
      - id: package
        name: Read canonical package version
        shell: bash
        run: |
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require matching release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v${{ steps.package.outputs.version }}"
      - name: Build compatibility CLI in CI
        run: cargo build --manifest-path native/fast-native/Cargo.toml --release --target ${{ matrix.target }}
      - name: Build Rust-core CLI in CI
        run: cargo build --manifest-path rust/simplicio-fast-core/Cargo.toml --release --target ${{ matrix.target }}
      - name: Stage and verify precompiled artifact
        shell: bash
        run: |
          compatibility_abi_dir="simplicio.fast-native_v1"
          core_abi_dir="simplicio.fast-core_v1"
          output="dist/${{ matrix.platform }}"
          mkdir -p "$output/$compatibility_abi_dir" "$output/$core_abi_dir"
          cp "native/fast-native/target/${{ matrix.target }}/release/${{ matrix.compatibility_filename }}" "$output/$compatibility_abi_dir/${{ matrix.compatibility_filename }}"
          cp "rust/simplicio-fast-core/target/${{ matrix.target }}/release/${{ matrix.core_filename }}" "$output/$core_abi_dir/${{ matrix.core_filename }}"
          python scripts/build_native_manifest.py \
            --binary "$output/$compatibility_abi_dir/${{ matrix.compatibility_filename }}" \
            --platform "${{ matrix.platform }}" \
            --version "${{ steps.package.outputs.version }}" \
            --source-commit "$GITHUB_SHA" \
            --toolchain "$(rustc --version)" \
            --output "$output/$compatibility_abi_dir/manifest.json"
          python scripts/verify_native_bundle.py \
            --root "$output" \
            --expected-platform "${{ matrix.platform }}" \
            --expected-version "${{ steps.package.outputs.version }}" \
            --json
          cargo run --quiet --manifest-path rust/simplicio-fast-core/Cargo.toml -- --version --json > "$output/$core_abi_dir/engine-manifest.json"
          python scripts/verify_fast_core_bundle.py \
            --binary "$output/$core_abi_dir/${{ matrix.core_filename }}" \
            --manifest "$output/$core_abi_dir/engine-manifest.json" \
            --expected-version "${{ steps.package.outputs.version }}" \
            --json
      - uses: actions/upload-artifact@v4
        with:
          name: simplicio-fast-engines-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: simplicio-fast-engines-*
          path: release-assets
      - name: Package release assets
        run: |
          find release-assets -mindepth 1 -maxdepth 1 -type d -print0 |
            while IFS= read -r -d '' directory; do
              archive="${directory}.tar.gz"
              tar -C "$directory" -czf "$archive" .
            done
      - name: Publish assets on matching tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*.tar.gz --clobber
