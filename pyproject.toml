[project]
name = "simplicio-fast"
version = "0.1.0"
description = "Binary, memory-mapped semantic snapshots for agentic code workflows"
requires-python = ">=3.11"

[project.scripts]
simplicio-fast = "simplicio_fast.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
