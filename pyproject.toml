[project]
name = "simplicio-fast"
version = "2.0.20"
description = "Semantic project memory and guarded change coordination for AI coding tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
integrated = [
  "simplicio-mapper>=0.26.1",
  "simplicio-cli>=0.18.1",
]

[project.scripts]
simplicio-fast = "simplicio_fast.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
simplicio_fast = ["release_policy.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
