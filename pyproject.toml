[project]
name = "simplicio-fast"
version = "2.0.25"
description = "Semantic project memory and guarded change coordination for AI coding tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
integrated = [
  "simplicio-mapper>=0.26.11,<0.27",
  "simplicio-cli>=0.18.6",
]

[project.scripts]
simplicio-fast = "simplicio_fast.cli:main"
simplicio-fast-cross-repo = "simplicio_fast.cross_repo_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
exclude = ["fixtures/conformance/v1/python/service.py"]

[tool.setuptools.package-data]
simplicio_fast = ["release_policy.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
